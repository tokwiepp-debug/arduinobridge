name: Build Windows Executable
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install pyinstaller flask flask-cors
      
      - shell: pwsh
        run: |
          pyinstaller --onefile --console --noupx -n test-flask test_flask.py 2>&1
          if (Test-Path "dist/test-flask.exe") {
            echo "SUCCESS"
            Get-Item "dist/test-flask.exe" | Select-Object Name, Length
          } else {
            echo "FAIL - checking files..."
            Get-ChildItem . -Recurse -Filter "*.exe" | Select-Object FullName
          }
      
      - uses: actions/upload-artifact@v4
        with:
          name: test-flask
          path: dist/
