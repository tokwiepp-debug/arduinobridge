name: Build Windows Executable
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --onefile --console --name hello test_hello.py 2>&1
          if (Test-Path "dist/hello.exe") {
            echo "SUCCESS"
            Get-Item "dist/hello.exe" | Select-Object Name, Length
          }
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hello-test
          path: dist/
