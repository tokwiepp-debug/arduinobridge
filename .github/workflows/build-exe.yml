name: Build Windows Executable
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: project

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pyinstaller flask flask-cors pyserial pyusb requests

      - name: Build x64
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location project/arduino_bridge
          Write-Host "Python architecture: $((python -c 'import struct; print(struct.calcsize("P") * 8)'))"
          pyinstaller --onefile --console --noupx --target-os=win64 --target-arch=x64 -n test-flask ../test_flask.py 2>&1
          if (Test-Path "dist/test-flask.exe") {
            Write-Host "SUCCESS"
            Get-Item "dist/test-flask.exe" | Select-Object Name, Length, @{N='Arch';E={'x64'}}
          } else {
            Write-Host "FAIL"
            Get-ChildItem . -Recurse -Filter "*.exe" | Select-Object FullName
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-flask-x64
          path: project/arduino_bridge/dist/
          retention-days: 30
