name: Build Windows Executable
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install deps
        run: pip install pyinstaller flask flask-cors

      - name: Build
        run: pyinstaller --onefile --console --noupx -n test-flask test_flask.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-flask
          path: dist/
