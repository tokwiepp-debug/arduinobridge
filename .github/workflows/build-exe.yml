name: Build Windows Executable
on:
  workflow_dispatch:
    inputs:
      project_path:
        description: 'Path to project'
        required: false
        default: ''
      artifact_name:
        description: 'Output name'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --upgrade pip pyinstaller pyserial pyusb requests flask flask-cors

      - name: Show structure
        shell: pwsh
        run: |
          $path = "project/${{ github.event.inputs.project_path }}"
          Get-ChildItem $path -Recurse | Select-Object FullName

      - name: Build
        shell: pwsh
        run: |
          $path = "project/${{ github.event.inputs.project_path }}"
          $outName = if ("${{ github.event.inputs.artifact_name }}" -ne "") { "${{ github.event.inputs.artifact_name }}" } else { "arduino-bridge" }
          Set-Location $path
          
          # First try direct pyinstaller with full path
          $script = "arduino_bridge/server.py"
          Write-Host "Building: $script"
          
          try {
            pyinstaller --onefile --console --noupx --distrib ./dist --workpath ./build --specpath . -n $outName $script 2>&1 | Tee-Object -Variable output
            Write-Host "PYINSTALLER OUTPUT: $output"
          } catch {
            Write-Host "ERROR: $_"
          }
          
          Write-Host "--- Checking dist folder ---"
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "No dist folder"
          }
          
          Write-Host "--- Checking for exe anywhere ---"
          Get-ChildItem . -Recurse -Filter "*.exe" | Select-Object FullName

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name || 'arduino-bridge' }}
          path: project/${{ github.event.inputs.project_path }}/dist/
          retention-days: 30
